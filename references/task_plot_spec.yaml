task_plot_spec:
  spec_version: '0.2'
  meta:
    task_name: Paired-Associate Learning Task
    mode: existing
    task_id: ''
  figure:
    output:
      filename: task_flow.png
      dpi: 300
      width_in: 16.0
      background: white
    layout:
      max_conditions: 3
      screens_per_timeline: 7
      screen_overlap_ratio: 0.1
      screen_slope: 0.08
      screen_slope_deg: 25.0
      timeline_gap: 0.18
      screen_aspect_ratio: 1.4545454545454546
      left_margin: 0.2
      right_margin: 0.03
      top_margin: 0.03
      bottom_margin: 0.05
      condition_label_gap: 0.014
      phase_label_pad: 0.01
      duration_label_gap: 0.006
      timeline_arrow_gap: 0.01
      timeline_arrow_screen_clearance: 0.007
      timeline_arrow_text_clearance: 0.01
      timeline_arrow_extra_per_screen: 0.015
      timeline_arrow_min_y: 0.02
      timeline_arrow_max_y: 0.96
  timelines:
  - condition: practice
    display_condition_label: Practice
    phases:
    - phase_name: study fixation
      display_phase_label: Fixation
      duration_ms:
        fixed: 500
      response_window_ms: null
      display_timing_label: 500 ms
      stim_ids:
      - fixation
      stimulus_example:
        summary: +
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: +
          color: white
          pos:
          - 0.0
          - 0.0
          height: 48.0
      notes: ''
    - phase_name: study pair
      display_phase_label: Study Pair
      duration_ms:
        fixed: 1500
      response_window_ms: null
      display_timing_label: 1500 ms
      stim_ids:
      - study_pair
      stimulus_example:
        summary: '[dynamic:study_pair]'
        modality: other
        draw_hint: annotation
        render_items:
        - kind: annotation
          text: 'Dynamic: study_pair'
      notes: ''
    - phase_name: practice study feedback
      display_phase_label: Feedback
      duration_ms:
        fixed: 800
      response_window_ms: null
      display_timing_label: 800 ms
      stim_ids: []
      stimulus_example:
        summary: '[annotation] practice study feedback'
        modality: other
        draw_hint: annotation
        render_items:
        - kind: annotation
          text: practice study feedback
      notes: ''
    - phase_name: study iti
      display_phase_label: ITI
      duration_ms:
        fixed: 400
      response_window_ms: null
      display_timing_label: 400 ms
      stim_ids:
      - fixation
      stimulus_example:
        summary: +
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: +
          color: white
          pos:
          - 0.0
          - 0.0
          height: 48.0
      notes: ''
    - phase_name: test fixation
      display_phase_label: Fixation
      duration_ms:
        fixed: 500
      response_window_ms: null
      display_timing_label: 500 ms
      stim_ids:
      - fixation
      stimulus_example:
        summary: +
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: +
          color: white
          pos:
          - 0.0
          - 0.0
          height: 48.0
      notes: ''
    - phase_name: test choice
      display_phase_label: Test Choice
      duration_ms:
        fixed: 6000
      response_window_ms: null
      display_timing_label: 6000 ms
      stim_ids:
      - test_choice
      stimulus_example:
        summary: '[dynamic:test_choice]'
        modality: other
        draw_hint: annotation
        render_items:
        - kind: annotation
          text: 'Dynamic: test_choice'
      notes: ''
    condition_variants:
    - scored_1
    - scored_2
    display_condition_note: 'Also: Scored 1, Scored 2'
  legend: []
